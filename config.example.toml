# Copy to ~/.config/decklock/config.toml. Paths resolve beside this file.
locale = "pt-BR"
pam_service = "login"
theme_preset = "classic" # catppuccin-mocha, catppuccin-latte, dracula, nord, tokyo-night, gruvbox
idle_seconds = 600
idle_enabled = true
idle_reuse_background = false
slideshow_seconds = 30
idle_slideshow_seconds = 30
# Explicit pools override legacy background paths. An empty pool is intentional.
# background_pool = ["/path/to/photo.jpg", "/path/to/video.mp4"]
# idle_pool = ["/path/to/idle.jpg"]
# theme = "themes/my-theme"
# background = "media/lock"       # File or directory of images/videos
# idle_background = "media/idle"
# Without overrides, use $XDG_CONFIG_HOME/midias/{bloqueio,ocioso}/{fotos,videos}.
# Directories are created automatically; empty idle media falls back to normal.
# controller_socket = "/absolute/path/to/sc-controller/socket"

# Follow the first GDK keymap group at startup; false selects the built-in BR map.
system_keyboard = true

# Optional layout override, also written by --settings. Otherwise use the theme.
# [layout]
# alignment = "center"
# arrangement = "vertical"
# spacing = 0
# padding = 0
# clock_visible = true
# idle_clock_visible = true
# avatar_visible = true
# keyboard_scale = 1.0

# Procedurals are media items: add these IDs to either pool above, alongside files.
# background_pool = ["procedural:starfield", "/path/photo.jpg"]
# idle_pool = ["procedural:lissajous"]
# Put pool keys before any TOML [table]. A chosen procedural stays for this lock.
# Per-item settings apply to every pool that uses the item.
[procedurals.starfield]
color = "#b4befe"
background = "#141725"
density = 120 # 1..300 (particle effects)
speed = 0.3 # 0.01..2.0
fps = 30 # 1..30
seed = 1

[procedurals.particles]
color = "#b4befe"

[procedurals.lissajous]
color = "#b4befe"
