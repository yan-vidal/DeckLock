# DeckLock screen locker configuration for hypridle.
general {
    lock_cmd = decklock --lock
    before_sleep_cmd = decklock --lock
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
