[package]
name = "decklock"
version = "0.3.1"
edition = "2024"
rust-version = "1.93"
description = "Customizable Wayland screen locker with an embedded keyboard"
publish = false

[features]
# The GStreamer sink needs its own X11 GL support, or video on X11 falls back
# to the software path. Tying it to this feature keeps the Wayland-only
# packages byte-for-byte unaffected.
x11 = ["dep:gdk4-x11", "gst-plugin-gtk4/x11egl", "gst-plugin-gtk4/x11glx"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-session-lock = { version = "0.4.1", features = ["v1_2"] }
# Optional X11 backend (#16): reduced guarantees, off by default.
gdk4-x11 = { version = "0.11", features = ["xlib"], optional = true }
glib = "0.22"
glib-unix = "0.22"
gstreamer = "0.25"
gst-plugin-gtk4 = { version = "0.15", features = ["static", "waylandegl", "gtk_v4_12"] }
socket2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fluent-bundle = "0.16"
unic-langid = "0.9"
libc = "0.2"
zeroize = "1.8"
unicode-normalization = "0.1"

tempfile = "3"

# Needs the X11 backend's dependency; `cargo build --examples` skips it otherwise.
[[example]]
name = "x11_intruder"
required-features = ["x11"]


[build-dependencies]
pkg-config = "0.3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
