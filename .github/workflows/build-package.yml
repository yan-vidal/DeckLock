name: Distribution package
on:
  workflow_call:
    inputs:
      target:
        description: Packaging target understood by scripts/package-release.py
        required: true
        type: string
      image:
        description: Container image digest for that distribution's build stack
        required: true
        type: string
      label:
        description: >
          Display name for this job. It forms the status check context
          "<caller job> / <label> package contract", which the repository's
          mainProtect ruleset requires by exact string. Renaming it removes a
          required check and blocks every pull request, so keep Arch's spelling.
        required: true
        type: string
      runner:
        description: >
          Hosted runner, which sets the architecture. The pinned images are
          multi-architecture indexes, so the same digest serves both.
        required: false
        default: ubuntu-24.04
        type: string
      artifact_suffix:
        description: Appended to the artifact name, so builds for two architectures do not collide
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ inputs.label }} package contract
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Build dependencies
        run: |
          case "${{ inputs.target }}" in
          arch)
            pacman -Syu --noconfirm --needed git rust python gtk4 gtk4-layer-shell gstreamer gst-plugins-base gst-plugins-good gst-libav pam
            ;;
          fedora)
            dnf install -y git rust cargo python3 gcc pkgconf-pkg-config rpm-build shadow-utils \
              gtk4-devel gtk4-layer-shell-devel gstreamer1-devel gstreamer1-plugins-base-devel \
              gstreamer1-plugins-good gstreamer1-libav pam-devel
            ;;
          ubuntu)
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git cargo rustc python3 build-essential pkg-config dpkg-dev \
              libgtk-4-dev libgtk4-layer-shell-dev libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav \
              libpam0g-dev
            ;;
          *)
            echo "Unknown packaging target: ${{ inputs.target }}" >&2
            exit 1
            ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Unprivileged package build
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- scripts/ci-build-package "${{ inputs.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.target }}-package${{ inputs.artifact_suffix }}
          path: |
            dist/*.pkg.tar.zst
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz
            dist/PKGBUILD
            dist/decklock.spec
            dist/control
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
