name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: DeckLock checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-gl libpam0g-dev libwayland-dev wayland-protocols libxkbcommon-dev meson ninja-build xvfb xauth dbus-x11
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.93.0
      - name: Locked dependencies and pinned mock compositor
        run: |
          cargo fetch --locked
          scripts/bootstrap-native --tests
      - name: Required gate
        run: scripts/check --all
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-evidence
          path: target/check-logs/
          if-no-files-found: warn
          retention-days: 14
  package:
    name: Package
    needs: check
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: arch
      # "Package / Arch package contract" is a required status check; do not respell.
      label: Arch
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6

  # Fedora's stack is older than Arch's, so this build records its own library
  # baseline instead of reusing Arch's. No VM gate installs it yet, so the
  # artifact stays a candidate and is never published.
  package-fedora:
    name: Package (Fedora)
    needs: check
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: fedora
      label: Fedora
      image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42

  # Ubuntu 26.04 packages gtk4-layer-shell 1.3.0. Debian 13 packages 1.0.4,
  # below the 1.2 floor derived from this binary's symbols, so there is no
  # Debian target yet.
  package-ubuntu:
    name: Package (Ubuntu)
    needs: check
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: ubuntu
      label: Ubuntu
      image: ubuntu:26.04@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d

  vm:
    name: Real Wayland and PAM
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage openssh-client acl
          test -c /dev/kvm
          sudo setfacl -m u:$(id -un):rw /dev/kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-package
          path: dist
      - name: Verify candidate and run disposable VM
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/test-vm.py --package dist/*.pkg.tar.zst
      - name: VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-evidence
          path: target/vm-logs/
          if-no-files-found: warn
          retention-days: 14
