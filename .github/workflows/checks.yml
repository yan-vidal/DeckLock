name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_call:
permissions:
  contents: read
# Superseded PR heads stop using runners. Main, tags and merge-group runs keep
# their independent evidence and are never cancelled by this policy.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: DeckLock isolated gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dependency image context and refresh epoch
        id: image-context
        run: |
          mkdir -p target/ci-image-context
          cp .github/ci/native-tests.Dockerfile target/ci-image-context/Dockerfile
          cp .github/ci/native-tests-entrypoint scripts/bootstrap-native target/ci-image-context/
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepared native test dependencies
        id: native-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/ci-image-context
          platforms: linux/amd64
          load: true
          push: false
          tags: decklock-native-tests:ci
          build-args: CACHE_EPOCH=${{ steps.image-context.outputs.week }}
          cache-from: type=gha,scope=decklock-native-amd64
          cache-to: type=gha,scope=decklock-native-amd64,mode=max
      - name: Cargo downloads
        uses: ./.github/actions/cache-cargo
        with:
          target: isolated-ubuntu
          identity: ${{ steps.native-image.outputs.imageid }}
      - name: Required gate
        env:
          NATIVE_IMAGE: ${{ steps.native-image.outputs.imageid }}
        run: |
          docker run --rm --init \
            --env DECKLOCK_CI_UID="$(id -u)" --env DECKLOCK_CI_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            "$NATIVE_IMAGE" scripts/check --all
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-evidence
          path: target/check-logs/
          if-no-files-found: warn
          retention-days: 14
  package:
    name: Package
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: arch
      # "Package / Arch package contract" is a required status check; do not respell.
      label: Arch
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6

  # Fedora's stack is older than Arch's, so this build records its own library
  # baseline instead of reusing Arch's. No VM gate installs it yet, so the
  # artifact stays a candidate and is never published.
  package-fedora:
    name: Package (Fedora)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: fedora
      label: Fedora
      image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42

  # Ubuntu 26.04 packages gtk4-layer-shell 1.3.0. Debian 13 packages 1.0.4,
  # below the 1.2 floor derived from this binary's symbols, so there is no
  # Debian target yet.
  package-ubuntu:
    name: Package (Ubuntu)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: ubuntu
      label: Ubuntu
      image: ubuntu:26.04@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d

  # aarch64 candidates: the same recipes, tests and package contract on an
  # arm64 runner. Arch has no official aarch64 image. The Ubuntu one also goes
  # through the VM gate below; neither is published yet.
  package-fedora-aarch64:
    name: Package (Fedora aarch64)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: fedora
      label: Fedora aarch64
      runner: ubuntu-24.04-arm
      artifact_suffix: -aarch64
      image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42

  package-ubuntu-aarch64:
    name: Package (Ubuntu aarch64)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build-package.yml
    with:
      target: ubuntu
      label: Ubuntu aarch64
      runner: ubuntu-24.04-arm
      artifact_suffix: -aarch64
      image: ubuntu:26.04@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d

  vm:
    name: Real Wayland and PAM
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage openssh-client acl
          test -c /dev/kvm
          sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Pinned VM image download
        uses: ./.github/actions/cache-vm
        with:
          target: arch
          arch: x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-package
          path: dist
      - name: Verify candidate and run disposable VM
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/test-vm.py --target arch --package dist/*.pkg.tar.zst
      - name: VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-evidence
          path: target/vm-logs/
          if-no-files-found: warn
          retention-days: 14

  vm-fedora:
    name: Real Wayland and PAM (Fedora)
    needs: package-fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage openssh-client acl
          test -c /dev/kvm
          sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Pinned VM image download
        uses: ./.github/actions/cache-vm
        with:
          target: fedora
          arch: x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fedora-package
          path: dist
      - name: Verify candidate and run disposable VM
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/test-vm.py --target fedora --package dist/*.rpm
      - name: VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-evidence-fedora
          path: target/vm-logs/
          if-no-files-found: warn
          retention-days: 14

  vm-ubuntu:
    name: Real Wayland and PAM (Ubuntu)
    needs: package-ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage openssh-client acl
          test -c /dev/kvm
          sudo setfacl -m u:$(id -un):rw /dev/kvm
      - name: Pinned VM image download
        uses: ./.github/actions/cache-vm
        with:
          target: ubuntu
          arch: x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu-package
          path: dist
      - name: Verify candidate and run disposable VM
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/test-vm.py --target ubuntu --package dist/*.deb
      - name: VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-evidence-ubuntu
          path: target/vm-logs/
          if-no-files-found: warn
          retention-days: 14

  # The same guest suite on the aarch64 candidate. Hosted arm64 runners expose
  # no /dev/kvm, so the guest is emulated (TCG) and its waits are scaled; the
  # x86_64 jobs above keep requiring KVM.
  vm-ubuntu-aarch64:
    name: Real Wayland and PAM (Ubuntu aarch64)
    needs: package-ubuntu-aarch64
    runs-on: ubuntu-24.04-arm
    # Above the sum of test-vm.py's own bounds on the native path (host provisioning
    # 76 min, boot 32, copying 10, guest phase 80, evidence 8 = 206), so a stuck guest
    # still ends in its log rather than a cancelled job. A passing run takes about
    # 18 min (run 38012670359) with QEMU's implementation-defined pointer
    # authentication, down from about 35 with QARMA5 and about 94 before the harness
    # packages were installed on the host. The timeout only caps a hang.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils genisoimage openssh-client cloud-guest-utils
      - name: Pinned VM image download
        uses: ./.github/actions/cache-vm
        with:
          target: ubuntu
          arch: aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu-package-aarch64
          path: dist
      - name: Verify candidate and run disposable VM
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/test-vm.py --target ubuntu --arch aarch64 --allow-emulation --provision-native --package dist/*.deb
      - name: VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-evidence-ubuntu-aarch64
          path: target/vm-logs/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: DeckLock checks
    needs: [check, package, package-fedora, package-ubuntu, package-fedora-aarch64, package-ubuntu-aarch64, vm, vm-fedora, vm-ubuntu, vm-ubuntu-aarch64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every isolated, package and VM gate
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          gates = json.loads(os.environ['GATE_RESULTS'])
          failures = {name: gate['result'] for name, gate in gates.items() if gate['result'] != 'success'}
          if failures:
              print(f'Required gates did not pass: {failures}', file=sys.stderr)
              sys.exit(1)
          print(f'All {len(gates)} required gates passed')
          PYCODE
