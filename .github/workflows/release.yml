name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/check-release-tag.py "$RELEASE_TAG"
      # Each target's artifact carries its own SHA256SUMS under the same name, so
      # they are kept apart; downloading them together would let one overwrite
      # the others and publish checksums for a single target.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-package
          path: artifacts/arch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fedora-package
          path: artifacts/fedora
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu-package
          path: artifacts/ubuntu
      - name: Reviewed release summary
        run: python3 scripts/release-notes.py --require-date > RELEASE-NOTES.md
      - name: Publish only verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          channel=()
          if [ "$(python3 scripts/release-channel.py)" = prerelease ]; then channel=(--prerelease); fi
          mkdir dist
          # Verify every target against the checksums written when its package was
          # built and tested before publishing any of them. The published
          # SHA256SUMS is those same build-time lines, not a recomputation.
          for target in arch fedora ubuntu; do
            (cd "artifacts/$target" && sha256sum --check SHA256SUMS)
            cat "artifacts/$target/SHA256SUMS" >> dist/SHA256SUMS
            cp "artifacts/$target"/decklock-*-x86_64.tar.gz dist/
          done
          cp artifacts/arch/*.pkg.tar.zst artifacts/arch/PKGBUILD dist/
          cp artifacts/fedora/*.rpm dist/
          cp artifacts/ubuntu/*.deb dist/
          cd dist
          # Three tarballs and three packages, each named once.
          test "$(wc -l < SHA256SUMS)" -eq 6
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.pkg.tar.zst ./*.rpm ./*.deb ./*.tar.gz PKGBUILD SHA256SUMS \
            --verify-tag "${channel[@]}" --title "DeckLock $RELEASE_TAG" --notes-file ../RELEASE-NOTES.md --generate-notes
